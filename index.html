<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Docket</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  :root {
    /* ---- Solid elevation scale (app surfaces) ---- */
    --bg-app: #0f0f13;      /* sidebar / outermost */
    --bg-main: #17171d;     /* main content surface */
    --bg-raised: #1e1e26;   /* inputs, hover, cards */
    --bg-raised-2: #262631; /* stronger hover / selected */
    --border: rgba(255, 255, 255, .08);
    --border-strong: rgba(255, 255, 255, .15);
    --text: #f2f2f4;
    --muted: #aeaeb6;
    --faint: #74747c;
    --shadow-modal: 0 20px 60px rgba(0, 0, 0, .55);

    /* ---- The two places glass is actually earned ---- */
    --glass-bg: rgba(23, 23, 29, .70);
    --glass-border: rgba(255, 255, 255, .10);
    --glass-blur: blur(20px) saturate(1.25) brightness(1.05);
    --modal-bg: rgba(27, 27, 34, .92);
    --modal-blur: blur(28px) saturate(1.35) brightness(1.06);
    --rim: inset 0 1px 0 rgba(255, 255, 255, .20);

    --accent: #0c86b6;
    --accent-text: #5aa9c9;
    --accent-contrast: #f2f2f4;
    --accent-soft: rgba(12, 134, 182, .16);

    --pri-high: #e17048;
    --pri-high-soft: rgba(225, 112, 72, .16);
    --pri-medium: #299981;
    --pri-medium-soft: rgba(41, 153, 129, .17);
    --pri-low: #8a80c4;
    --pri-low-soft: rgba(115, 104, 170, .18);

    --waiting: #ebaa13;
    --waiting-soft: rgba(235, 170, 19, .16);
    --danger: #ef4a72;
    --danger-soft: rgba(229, 0, 65, .16);

    --radius: 12px;
    --radius-sm: 9px;
    --radius-xs: 7px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --motion: 200ms;
    --motion-fast: 140ms;

    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; }

  #docket-root {
    background: var(--bg-app);
    color: var(--text);
    width: 100%;
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #docket-root button { font-family: inherit; cursor: pointer; }
  #docket-root input, #docket-root textarea, #docket-root select {
    font-family: inherit;
    color: var(--text);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color var(--motion-fast) var(--ease);
  }
  #docket-root input:focus, #docket-root textarea:focus, #docket-root select:focus {
    outline: none;
    border-color: var(--accent-text);
  }

  /* ---------- Sidebar — solid, not glass ---------- */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: var(--bg-app);
    border-right: 1px solid var(--border);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .brand { display: flex; align-items: baseline; gap: 8px; padding: 0 6px; }
  .brand-mark { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }

  .nav-btn {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 7px 10px; text-align: left; color: var(--muted); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
    transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .nav-btn:hover { background: var(--bg-raised); color: var(--text); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent-text); }

  .group-label { font-size: 11px; font-weight: 600; color: var(--faint); padding: 2px 6px; margin-top: 2px; }

  .project-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--radius-sm);
    color: var(--muted); font-size: 13px; cursor: pointer; border: 1px solid transparent;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .project-item:hover { background: var(--bg-raised); color: var(--text); }
  .project-item.active { background: var(--bg-raised-2); color: var(--text); border-color: var(--border-strong); }
  .project-icon { width: 15px; height: 15px; flex-shrink: 0; color: var(--faint); display: flex; align-items: center; justify-content: center; }
  .project-icon svg { width: 100%; height: 100%; }
  .project-icon.tag-hash { font-size: 13px; font-weight: 800; line-height: 1; }
  .project-item:hover .project-icon { color: var(--muted); }
  .project-item.active .project-icon { color: var(--accent-text); }
  .project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-name-block { flex: 1; min-width: 0; }
  .project-name-block .project-name { font-weight: 600; }
  .project-name-sub { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .project-count { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .add-project-btn {
    background: transparent; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    padding: 7px 10px; color: var(--faint); font-size: 13px; text-align: left; margin-top: 2px; width: 100%;
    transition: color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .add-project-btn:hover { color: var(--muted); border-color: var(--muted); }

  .sidebar-footer { margin-top: auto; padding: 6px; display: flex; flex-direction: column; gap: 7px; }
  .footer-link {
    background: none; border: none; color: var(--faint); font-size: 11.5px; padding: 0;
    text-decoration: underline; text-underline-offset: 2px; text-align: left; width: fit-content;
  }
  .footer-link:hover { color: var(--muted); }
  .footer-link.danger:hover { color: var(--danger); }
  .footer-meta { font-size: 10.5px; color: var(--faint); margin-top: -2px; }

  /* ---------- Content column ---------- */
  .content-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .main {
    flex: 1;
    background: var(--bg-main);
    overflow-y: auto;
    position: relative;
  }

  /* The sticky topbar — the one earned glass surface. Real task rows scroll
     underneath it, which is the actual mechanism that makes translucency read
     as glass rather than a decorative filter. */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: var(--rim);
    padding: 16px 32px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    transition: box-shadow var(--motion) var(--ease);
  }
  .topbar.scrolled {
    box-shadow: var(--rim), 0 10px 24px rgba(0, 0, 0, .35);
  }
  .main-title-row { display: flex; align-items: center; gap: 10px; }
  .main-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .main-sub { font-size: 12.5px; color: var(--faint); margin-top: 3px; }
  .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--muted); padding: 5px 11px; font-size: 12px;
    transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .icon-btn:hover { color: var(--text); background: var(--bg-raised-2); }

  .view-toggle { display: flex; gap: 2px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
  .view-toggle button {
    background: transparent; border: none; color: var(--faint); font-size: 12px; font-weight: 600;
    padding: 4px 11px; border-radius: 6px; transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .view-toggle button.active { background: var(--bg-raised-2); color: var(--text); }
  .view-toggle button:not(.active):hover { color: var(--muted); }

  .main-inner { max-width: 720px; padding: 24px 32px 50px; }
  .main-inner.wide { max-width: none; }

  .main::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 9px; }
  .main::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }

  .reminder-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--waiting-soft); border: 1px solid rgba(235,170,19,.3); color: var(--muted);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 18px; font-size: 12.5px;
  }
  .reminder-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .reminder-banner button { font-size: 11.5px; padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: transparent; color: var(--muted); }
  .reminder-banner button.primary { background: var(--waiting); color: #241a08; border: none; font-weight: 600; }

  .course-info {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 4px 20px; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 20px; font-size: 12.5px;
  }
  .course-info-field { padding: 3px 0; }
  .course-info-label { color: var(--faint); font-size: 11px; margin-bottom: 1px; }
  .course-info-value { color: var(--muted); }
  .course-info-value.empty { color: var(--faint); font-style: italic; }
  .course-info-value a { color: var(--accent-text); text-decoration: none; }
  .course-info-value a:hover { text-decoration: underline; }

  .quick-add { display: flex; gap: 8px; margin-bottom: 20px; }
  .quick-add input { flex: 1; padding: 10px 13px; font-size: 13.5px; }
  .quick-add select { padding: 10px 10px; font-size: 13px; max-width: 180px; }
  .quick-add button {
    background: var(--accent); color: var(--accent-contrast); border: none; border-radius: var(--radius-sm);
    padding: 0 18px; font-size: 13px; font-weight: 600; transition: filter var(--motion-fast) var(--ease), transform var(--motion-fast) var(--ease);
  }
  .quick-add button:hover { filter: brightness(1.12); }
  .quick-add button:active { transform: scale(.96); }

  .task-section { margin-bottom: 26px; }

  .dash-cards-mask {
    overflow: hidden; margin-bottom: 10px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
  }
  .dash-cards {
    display: grid; grid-template-rows: repeat(2, auto); grid-auto-flow: column; grid-auto-columns: 220px;
    gap: 12px; overflow-x: auto; padding: 4px 16px 12px; scroll-behavior: smooth;
  }
  .dash-card {
    position: relative; display: flex; flex-direction: column; height: 210px;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px; cursor: pointer;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), opacity var(--motion-fast) var(--ease);
  }
  .dash-card:hover { background: var(--bg-raised-2); border-color: var(--border-strong); }
  .dash-card.dragging { opacity: .4; }
  .dash-card.drag-before { box-shadow: inset 3px 0 0 var(--accent-text); }
  .dash-card.drag-after { box-shadow: inset -3px 0 0 var(--accent-text); }
  .dash-pin-btn {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; padding: 4px;
    background: transparent; border: none; color: var(--faint); opacity: 0;
    transition: opacity var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .dash-pin-btn svg { width: 100%; height: 100%; }
  .dash-card:hover .dash-pin-btn { opacity: 1; }
  .dash-pin-btn:hover { color: var(--danger); }
  .dash-card-main { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; padding-right: 16px; flex-shrink: 0; }
  .dash-card-main .project-icon { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
  .dash-card-text { min-width: 0; }
  .dash-card-name {
    font-size: 13.5px; font-weight: 600; overflow: hidden; white-space: normal;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25;
  }
  .dash-card-subtitle {
    font-size: 11.5px; color: var(--faint); overflow: hidden; white-space: normal; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25;
  }
  .dash-card-links { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
  .dash-link-btn {
    display: block; text-align: center; font-size: 12px; font-weight: 600; color: var(--accent-text);
    background: var(--accent-soft); border: 1px solid transparent; padding: 6px 10px; border-radius: var(--radius-xs);
    text-decoration: none; flex-shrink: 0; transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dash-link-btn:hover { background: rgba(90, 169, 201, .28); border-color: var(--accent-text); }
  .dash-link-ghost {
    display: block; text-align: center; font-size: 11.5px; color: var(--faint); flex-shrink: 0;
    background: transparent; border: 1px dashed var(--border-strong); padding: 6px 10px; border-radius: var(--radius-xs);
    transition: color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .dash-link-ghost:hover { color: var(--muted); border-color: var(--muted); }
  .dash-card-footer {
    flex-shrink: 0; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--faint);
  }
  .home-dashboard-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 4px 2px 12px; }

  .kanban-board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .kanban-column {
    flex: 0 0 258px; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px; transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .kanban-column.drag-over { background: var(--accent-soft); border-color: var(--accent-text); }
  .kanban-column-header {
    font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center;
    justify-content: space-between; padding: 4px 6px 10px;
  }
  .kanban-cards { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
  .kanban-empty { font-size: 12px; color: var(--faint); text-align: center; padding: 14px 4px; }
  .kanban-column .task-row.dragging { opacity: .4; }
  .kanban-column .task-row { background: var(--bg-main); }
  .kanban-column .task-row:hover { background: var(--bg-raised-2); }
  .kanban-column .task-row.open { background: var(--bg-raised-2); }
  .kanban-column .notes-preview { max-width: 160px; }
  .task-section-title {
    font-size: 12px; font-weight: 700; color: var(--muted);
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-left: 2px;
  }
  .task-section-title .project-icon { width: 13px; height: 13px; }

  .task-list { display: flex; flex-direction: column; gap: 2px; }

  .task-row {
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .task-row:hover { background: var(--bg-raised); }
  .task-row.open { background: var(--bg-raised); border-color: var(--border-strong); }

  .task-main { display: flex; align-items: flex-start; gap: 9px; padding: 9px 9px; }

  .checkbox {
    width: 17px; height: 17px; border-radius: 6px; border: 1.5px solid var(--border-strong);
    background: transparent; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .checkbox:hover { border-color: var(--accent-text); }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after {
    content: ""; width: 7px; height: 4px; border-left: 1.5px solid var(--accent-contrast); border-bottom: 1.5px solid var(--accent-contrast);
    transform: rotate(-45deg) translate(0, -1px);
  }

  .priority-pill {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
    border: 1.5px solid var(--border-strong); background: transparent;
    font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    color: var(--faint); transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .priority-pill.high { background: var(--pri-high-soft); border-color: var(--pri-high); color: var(--pri-high); }
  .priority-pill.medium { background: var(--pri-medium-soft); border-color: var(--pri-medium); color: var(--pri-medium); }
  .priority-pill.low { background: var(--pri-low-soft); border-color: var(--pri-low); color: var(--pri-low); }

  .task-body { flex: 1; min-width: 0; cursor: pointer; }
  .task-title { font-size: 13.5px; word-break: break-word; }
  .task-row.done .task-title { color: var(--faint); text-decoration: line-through; }
  .task-meta { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .task-meta-note { font-size: 11.5px; color: var(--faint); }
  .notes-preview { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
  .subtask-count { font-size: 11px; color: var(--faint); }
  .status-badge { font-size: 10.5px; padding: 1px 8px; border-radius: 20px; font-weight: 600; }
  .status-badge.in_progress { background: var(--accent-soft); color: var(--accent-text); }
  .status-badge.waiting { background: var(--waiting-soft); color: var(--waiting); }
  .due-badge { font-size: 10.5px; padding: 1px 8px; border-radius: 20px; font-weight: 600; }
  .due-badge.overdue { background: var(--danger-soft); color: var(--danger); }
  .due-badge.soon { background: var(--waiting-soft); color: var(--waiting); }
  .due-badge.later { background: rgba(255, 255, 255, .06); color: var(--faint); }
  .link-chip { font-size: 11px; color: var(--faint); text-decoration: none; }
  .link-chip:hover { color: var(--accent-text); }
  .tag-pill {
    font-size: 11px; color: var(--accent-text); background: var(--accent-soft);
    padding: 1px 8px; border-radius: 20px; cursor: pointer; transition: background var(--motion-fast) var(--ease);
  }
  .tag-pill:hover { background: rgba(90, 169, 201, .28); }
  .tag-editor {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 8px; margin-top: 4px;
  }
  .tag-chip {
    font-size: 11.5px; color: var(--accent-text); background: var(--accent-soft);
    padding: 2px 4px 2px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;
  }
  .tag-chip button { background: none; border: none; color: var(--accent-text); font-size: 12px; padding: 0 4px; opacity: .7; }
  .tag-chip button:hover { opacity: 1; }
  .tag-input {
    flex: 1; min-width: 100px; border: none !important; background: transparent !important;
    padding: 3px 4px !important; font-size: 12px;
  }
  .tag-input:focus { outline: none; }

  .links-editor { display: flex; flex-direction: column; gap: 4px; }
  .link-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 10px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-xs);
  }
  .link-row a { color: var(--accent-text); font-size: 12.5px; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row a:hover { text-decoration: underline; }

  .tag-chip-toggle {
    font-size: 12px; color: var(--muted); background: var(--bg-raised); border: 1px solid var(--border-strong);
    padding: 4px 11px; border-radius: 20px; transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .tag-chip-toggle:hover { color: var(--text); }
  .tag-chip-toggle.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-text); }

  .meeting-lines { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .meeting-line {
    display: flex; align-items: center; gap: 8px; padding: 5px 2px;
    border-bottom: 1px solid var(--border);
  }
  .meeting-line.done { opacity: .7; }
  .meeting-line .subtask-title { flex: 1; font-size: 12.5px; }
  .line-project-select { font-size: 11.5px; padding: 4px 6px; max-width: 150px; }

  .row-actions { display: flex; gap: 2px; opacity: 0; flex-shrink: 0; transition: opacity var(--motion-fast) var(--ease); }
  .task-row:hover .row-actions { opacity: 1; }
  .mini-btn { background: none; border: none; color: var(--faint); font-size: 11px; padding: 3px 5px; border-radius: 6px; }
  .mini-btn:hover { color: var(--text); background: var(--bg-raised-2); }
  .mini-btn.danger:hover { color: var(--danger); }

  .task-detail-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 340ms var(--ease);
  }
  .task-detail-wrap.open { grid-template-rows: 1fr; }
  .task-detail-wrap > .task-detail {
    overflow: hidden; min-height: 0;
    opacity: 0;
    transition: opacity 200ms var(--ease);
  }
  .task-detail-wrap.open > .task-detail { opacity: 1; transition-delay: 100ms; }
  .task-detail { padding: 0 9px 12px 34px; display: flex; flex-direction: column; gap: 10px; }

  @keyframes just-added-flash {
    0% { background: rgba(12, 134, 182, .38); }
    70% { background: rgba(12, 134, 182, .38); }
    100% { background: transparent; }
  }
  .task-row.just-added { animation: just-added-flash 1500ms var(--ease) forwards; border-radius: var(--radius-sm); }

  @keyframes checkbox-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .checkbox.pop { animation: checkbox-pop 360ms var(--ease); }

  .task-row.completing .task-title {
    transition: color 340ms var(--ease);
    color: var(--faint);
    text-decoration: line-through;
  }
  .task-row.completing { transition: opacity 340ms var(--ease); opacity: .45; }

  .detail-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .detail-field { display: flex; flex-direction: column; gap: 3px; }
  .detail-field label { font-size: 10.5px; color: var(--faint); }
  .detail-field select, .detail-field input { font-size: 12px; padding: 6px 9px; }

  .task-notes { width: 100%; min-height: 60px; font-size: 12.5px; padding: 9px 11px; resize: vertical; color: var(--muted); }
  .task-notes::placeholder { color: var(--faint); }

  .subtasks { display: flex; flex-direction: column; gap: 2px; }
  .subtask-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
  .subtask-row .checkbox { width: 14px; height: 14px; border-radius: 4px; }
  .subtask-row .checkbox.checked::after { width: 5px; height: 3px; }
  .subtask-title { flex: 1; font-size: 12.5px; }
  .subtask-row.done .subtask-title { color: var(--faint); text-decoration: line-through; }
  .subtask-add { display: flex; gap: 6px; margin-top: 4px; }
  .subtask-add input { flex: 1; font-size: 12px; padding: 6px 9px; background: transparent; border: 1px dashed var(--border-strong); }
  .subtask-add input:focus { border-style: solid; background: var(--bg-raised); }
  .mini-add-btn {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: var(--radius-xs);
    background: var(--bg-raised); border: 1px solid var(--border-strong); color: var(--muted);
    font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .mini-add-btn:hover { color: var(--text); background: var(--bg-raised-2); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--faint); }
  .empty-state-title { font-size: 14px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .empty-state-sub { font-size: 12.5px; }

  /* Toast floats over real scrolled content, same justification as the topbar */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--muted);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    font-size: 12.5px; padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s var(--ease); box-shadow: var(--shadow-modal), var(--rim);
    display: flex; align-items: center; gap: 12px;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast-undo-btn {
    background: none; border: none; color: var(--accent-text); font-weight: 700; font-size: 12.5px;
    padding: 0; text-decoration: underline; text-underline-offset: 2px; flex-shrink: 0;
  }

  .save-warning {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 30;
    background: var(--danger-soft); border: 1px solid var(--danger); color: var(--text);
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 12.5px;
    box-shadow: var(--shadow-modal); max-width: 90vw;
  }
  .save-warning-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .save-warning-actions button {
    font-size: 11.5px; padding: 5px 11px; border-radius: var(--radius-xs); border: 1px solid var(--danger);
    background: transparent; color: var(--text); font-weight: 600;
  }
  .save-warning-actions button:hover { background: var(--danger); }
  .save-warning-actions button#save-warning-export { background: var(--danger); }
  .save-warning-actions button#save-warning-export:hover { filter: brightness(1.1); }

  /* Modal — floats over a dimmed, blurred view of the real app: the other
     place glass is structurally earned. */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(8, 9, 11, 0.6);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 20;
    transition: opacity 200ms var(--ease);
  }
  .modal-backdrop.entering, .modal-backdrop.leaving { opacity: 0; }
  .modal-backdrop.entering .modal, .modal-backdrop.leaving .modal { transform: scale(.62) translateY(10px); opacity: 0; }
  .modal {
    background: var(--modal-bg); border: 1px solid var(--glass-border); border-radius: var(--radius);
    box-shadow: var(--shadow-modal), var(--rim); padding: 22px; width: 360px; max-height: 86vh; overflow-y: auto;
    -webkit-backdrop-filter: var(--modal-blur); backdrop-filter: var(--modal-blur);
    transform: scale(1); opacity: 1;
    transition: transform 300ms var(--ease), opacity 260ms var(--ease);
  }
  .modal h3 { margin: 0 0 14px; font-size: 14px; }
  .modal label { font-size: 12px; color: var(--faint); display: block; margin-bottom: 4px; margin-top: 10px; }
  .modal input, .modal select { width: 100%; padding: 9px 11px; font-size: 13px; }
  .modal p.hint { font-size: 12px; color: var(--faint); margin: 4px 0 0; }
  .icon-picker {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
    max-height: 190px; overflow-y: auto; margin-top: 4px; padding: 2px;
  }
  .icon-pick {
    width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-xs);
    color: var(--faint); padding: 8px; transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
  }
  .icon-pick svg { width: 100%; height: 100%; }
  .icon-pick:hover { color: var(--muted); background: var(--bg-raised-2); }
  .icon-pick.selected { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-text); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions button {
    padding: 7px 15px; border-radius: var(--radius-sm); font-size: 12.5px; border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--muted); transition: background var(--motion-fast) var(--ease);
  }
  .modal-actions button:hover { background: var(--bg-raised-2); }
  .modal-actions button.primary { background: var(--accent); color: var(--accent-contrast); border: none; font-weight: 600; }
  .modal-actions button.primary:hover { filter: brightness(1.12); }
  .modal-actions button.danger { color: var(--danger); border-color: var(--danger-soft); }

  @media (prefers-reduced-transparency: reduce) {
    :root { --glass-bg: #1c1c24; --modal-bg: #1c1c24; }
    .topbar, .modal, .toast { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }

  @media (max-width: 720px) {
    #docket-root { flex-direction: column; height: 100vh; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .topbar { padding: 14px 18px; }
    .main-inner { padding: 18px; }
  }
</style>
</head>
<body>

<div id="docket-root">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-col">
    <div class="main" id="main">
      <div class="topbar" id="topbar"></div>
      <div class="main-inner" id="main-inner"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-slot"></div>
<div class="save-warning" id="save-warning" style="display:none;">
  <span>Changes aren't saving right now. Export a backup so nothing gets lost.</span>
  <div class="save-warning-actions">
    <button type="button" id="save-warning-retry">Retry now</button>
    <button type="button" id="save-warning-export">Export backup</button>
  </div>
</div>
<input type="file" id="import-input" accept="application/json" style="display:none">

  function migrateTask(t) {
    if (t.status === undefined) t.status = t.done ? "done" : "todo";

    if (t.link === undefined) t.link = "";

    if (t.tags === undefined) t.tags = [];

  function migrateProject(p) {

    if (m.lines === undefined) m.lines = [];

  function showToast(msg) {

  function showUndoToast(msg, undoFn) {

    btn.type = "button";
