  let saveTimer = null;
  let saveFailCount = 0;
  function scheduleSaveOnly() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
  function scheduleSave() { state.updatedAt = Date.now(); scheduleSaveOnly(); }

  function hasLiveArtifactStorage() {
    return typeof window.storage !== "undefined" && window.storage && typeof window.storage.set === "function" && typeof window.storage.get === "function";
  }

  const IDB_NAME = "docket-db";
  const IDB_STORE = "kv";
  let idbPromise = null;
  function openIdb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) { reject(new Error("indexedDB not supported in this browser")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("indexedDB open failed"));
    });
    return idbPromise;
  }
  async function idbGet(key) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
      req.onerror = () => reject(req.error || new Error("indexedDB get failed"));
    });
  }
  async function idbSet(key, value) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error || new Error("indexedDB set failed"));
    });
  }
  async function hasIndexedDbFallback() {
    try {
      await idbSet("__docket_idb_test__", "1");
      return true;
    } catch (e) {
      return false;
    }
  }

  const usingLocalFallback = !hasLiveArtifactStorage();
  let idbConfirmedWorking = false;

  async function storageGet(key) {
    if (hasLiveArtifactStorage()) return window.storage.get(key, false);
    const val = await idbGet(key);
    return val !== null ? { key, value: val } : null;
  }
  async function storageSet(key, value) {
    if (hasLiveArtifactStorage()) return window.storage.set(key, value, false);
    await idbSet(key, value);
    idbConfirmedWorking = true;
    return { key, value };
  }

  // One-time migration: earlier builds of Docket saved to localStorage when run
  // standalone. Pull that over into IndexedDB so nothing from that period is lost.
  async function migrateFromLocalStorageIfNeeded() {
    if (hasLiveArtifactStorage()) return;
    try {
      const oldData = localStorage.getItem("docket-ls:" + STORAGE_KEY);
      if (oldData && !(await idbGet(STORAGE_KEY))) {
        await idbSet(STORAGE_KEY, oldData);
      }
      const oldMeta = localStorage.getItem("docket-ls:" + META_KEY);
      if (oldMeta && !(await idbGet(META_KEY))) {
        await idbSet(META_KEY, oldMeta);
      }
    } catch (e) { /* nothing to migrate, or IndexedDB unavailable — load() will handle that */ }
  }

  async function save() {
    if (!hasLiveArtifactStorage() && !idbConfirmedWorking && !(await hasIndexedDbFallback())) {
      console.error("Docket: no storage backend available — not a live artifact, and IndexedDB is blocked (private browsing?). Nothing can be saved.");
      showSaveWarning("This browser won't let the page save anything right now (private browsing mode blocks it). Export a backup before you close this tab.");
      return;
    }
    try {
      const result = await storageSet(STORAGE_KEY, JSON.stringify(state));
      if (!result) throw new Error("storage write returned no result");
      saveFailCount = 0;
      hideSaveWarning();
      syncPush();
    } catch (e) {
      console.error("Docket: save failed —", e);
      saveFailCount++;
      if (saveFailCount <= 5) {
        showToast(`Save failed, retrying\u2026 (${saveFailCount}/5)`);
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, Math.min(1500 * saveFailCount, 10000));
      } else {
        showSaveWarning("Changes aren't saving right now. Export a backup so nothing gets lost. (See the browser console for the specific error.)");
      }
    }
  }

  function showSaveWarning(message) {
    const el = document.getElementById("save-warning");
    if (!el) return;
    if (message) {
      const span = el.querySelector("span");
      if (span) span.textContent = message;
    }
    el.style.display = "flex";
  }
  function hideSaveWarning() {
    const el = document.getElementById("save-warning");
    if (el) el.style.display = "none";
  }

  async function saveMeta() {
    if (!hasLiveArtifactStorage() && !idbConfirmedWorking && !(await hasIndexedDbFallback())) return;
    try { await storageSet(META_KEY, JSON.stringify(meta)); } catch (e) { /* non-critical */ }
  }

  async function load() {
    mainInnerEl.innerHTML = '<div class="empty-state"><div class="empty-state-title">Loading\u2026</div></div>';
    const idbWorks = hasLiveArtifactStorage() ? true : await hasIndexedDbFallback();
    if (!hasLiveArtifactStorage() && !idbWorks) {
      console.error("Docket: no storage backend available at load time — starting from a blank in-memory session that cannot be saved.");
      state = defaultState();
      meta = { lastExportAt: null, lastDismissedAt: null };
      render();
      showSaveWarning("This browser won't let the page save anything right now (private browsing mode blocks it). Import a backup below, and export before you close this tab.");
      return;
    }
    await migrateFromLocalStorageIfNeeded();
    try {
      const mresult = await storageGet(META_KEY).catch(() => null);
      if (mresult && mresult.value) meta = JSON.parse(mresult.value);
    } catch (e) { /* use defaults */ }
    try {
      let result = await storageGet(STORAGE_KEY).catch(() => null);
      if (!result) result = await storageGet(OLD_STORAGE_KEY).catch(() => null);
      state = result && result.value ? JSON.parse(result.value) : defaultState();
      state.projects = state.projects.map(migrateProject);
      state.tasks = state.tasks.map(migrateTask);
      if (!state.meetings) state.meetings = [];
      state.meetings = state.meetings.map(migrateMeeting);
      if (!state.updatedAt) state.updatedAt = Date.now();
    } catch (e) {
      console.error("Docket: load failed —", e);
      state = defaultState();
    }
    if (syncConfigured()) {
      try { await syncPull(); }
      catch (e) { console.error("Docket: could not reach GitHub at open, using local data —", e); }
    }
    render();
    if (usingLocalFallback && idbWorks) {
      showToast("Saving to this browser only (not synced with Claude or other devices)");
    }
  }

  // ---------- data helpers ----------
  function activeProjects() { return state.projects.filter(p => !p.archived); }
  function archivedProjects() { return state.projects.filter(p => p.archived); }
  function unarchiveProject(id) {
    const p = projectById(id);
    p.archived = false;
    scheduleSave(); render();
    showToast(`"${p.name}" restored`);
  }

  function nextPinOrder() {
    return Math.max(0, ...state.projects.map(p => p.pinOrder || 0)) + 1;
  }
  function togglePinned(id) {
    const p = projectById(id);
    p.pinned = !p.pinned;
    if (p.pinned) p.pinOrder = nextPinOrder();
    scheduleSave(); render();
  }
  function addProjectLink(id, label, url) {
    const p = projectById(id);
    if (!label.trim() || !url.trim()) return;
    let href = url.trim();
    if (!/^https?:\/\//i.test(href)) href = "https://" + href;
    p.links.push({ id: uid(), label: label.trim(), url: href });
    scheduleSave();
  }
  function removeProjectLink(projectId, linkId) {
    const p = projectById(projectId);
    p.links = p.links.filter(l => l.id !== linkId);
    scheduleSave();
  }
  function pinnedProjects() {
    return activeProjects().filter(p => p.pinned).sort((a, b) => (a.pinOrder || 0) - (b.pinOrder || 0));
  }
  function reorderPinned(draggedId, targetId, insertAfter) {
    const pinned = pinnedProjects();
    const dragged = pinned.find(p => p.id === draggedId);
    if (!dragged || draggedId === targetId) return;
    const rest = pinned.filter(p => p.id !== draggedId);
    const targetIdx = rest.findIndex(p => p.id === targetId);
    const insertAt = insertAfter ? targetIdx + 1 : targetIdx;
    rest.splice(insertAt, 0, dragged);
    rest.forEach((p, i) => { p.pinOrder = i; });
    scheduleSave(); render();
  }
  function projectById(id) { return state.projects.find(p => p.id === id); }
  const STALE_DONE_MS = 30 * 24 * 60 * 60 * 1000;
  function isStaleDone(t) {
    return t.status === "done" && t.completedAt && (Date.now() - t.completedAt) > STALE_DONE_MS;
  }
  function tasksFor(projectId) { return state.tasks.filter(t => t.projectId === projectId && !t.parentId && !isStaleDone(t)); }
  function subtasksFor(taskId) { return state.tasks.filter(t => t.parentId === taskId); }
  function openCount(projectId) { return state.tasks.filter(t => t.projectId === projectId && !t.parentId && t.status !== "done").length; }

  function addProject(name, category, icon) {
    const color = PALETTE[state.projects.length % PALETTE.length];
    let finalIcon = icon || null;
    if (!finalIcon) {
      const iconKeys = Object.keys(ICON_LIBRARY);
      finalIcon = iconKeys[state.projects.length % iconKeys.length];
    }
    const p = { id: uid(), name, category, color, icon: finalIcon, archived: false, pinned: true, pinOrder: nextPinOrder(), links: [], courseCode: "", instructorName: "", instructorEmail: "", idName: "", idEmail: "", createdAt: Date.now() };
    state.projects.push(p);
    ui.selected = p.id;
    scheduleSave(); render();
  }

  function addTask(projectId, title) {
    if (!title.trim()) return;
    const newTask = {
      id: uid(), projectId, parentId: null, title: title.trim(), notes: "",
      priority: "none", status: "todo", waitingOn: "", link: "", dueDate: null, tags: [], createdAt: Date.now()
    };
    state.tasks.push(newTask);
    justAddedId = newTask.id;
    scheduleSave(); render();
    justAddedId = null;
  }

  function addSubtask(parentId, title) {
    if (!title.trim()) return;
    const parent = state.tasks.find(t => t.id === parentId);
    const newTask = {
      id: uid(), projectId: parent.projectId, parentId, title: title.trim(), notes: "",
      priority: "none", status: "todo", waitingOn: "", link: "", dueDate: null, tags: [], createdAt: Date.now()
    };
    state.tasks.push(newTask);
    justAddedId = newTask.id;
    scheduleSave(); render();
    justAddedId = null;
  }

  function toggleDone(id) {
    const t = state.tasks.find(t => t.id === id);
    if (t.status !== "done") {
      // Play the completion fade on the real row before the list re-sorts it away.
      const rowEl = mainInnerEl.querySelector(`[data-task="${id}"]`);
      if (rowEl) {
        rowEl.querySelector(".checkbox").classList.add("checked", "pop");
        rowEl.classList.add("completing");
        t.status = "done";
        t.completedAt = Date.now();
        scheduleSave();
        setTimeout(render, 380);
        return;
      }
      t.status = "done";
      t.completedAt = Date.now();
    } else {
      t.status = "todo";
      t.completedAt = null;
    }
    scheduleSave(); render();
  }

  function cyclePriority(id) {
    const t = state.tasks.find(t => t.id === id);
    const order = ["none", "low", "medium", "high"];
    t.priority = order[(order.indexOf(t.priority) + 1) % order.length];
    scheduleSave(); render();
  }
  function setPriority(id, priority) {
    const t = state.tasks.find(t => t.id === id);
    t.priority = priority;
    scheduleSave(); render();
  }

  function setStatus(id, status) {
    const t = state.tasks.find(t => t.id === id);
    t.status = status;
    t.completedAt = status === "done" ? Date.now() : null;
    scheduleSave(); render();
  }

  function updateField(id, field, value) {
    const t = state.tasks.find(t => t.id === id);
    t[field] = value;
    scheduleSave();
  }

  function deleteTask(id) {
    const removed = state.tasks.find(t => t.id === id);
    if (!removed) return;
    const removedChildren = state.tasks.filter(t => t.parentId === id);
    state.tasks = state.tasks.filter(t => t.id !== id && t.parentId !== id);
    scheduleSave(); render();
    showUndoToast(`Deleted "${removed.title}"`, () => {
      state.tasks.push(removed, ...removedChildren);
      scheduleSave(); render();
    });
  }

  function deleteProject(id) {
    state.projects = state.projects.filter(p => p.id !== id);
    state.tasks = state.tasks.filter(t => t.projectId !== id);
    if (ui.selected === id) ui.selected = "home";
    scheduleSave(); render();
  }

  function findDuplicateProjectGroups() {
    const groups = {};
    state.projects.forEach(p => {
      const key = p.category + "::" + p.name.trim().toLowerCase();
      (groups[key] = groups[key] || []).push(p);
    });
    return Object.values(groups).filter(g => g.length > 1);
  }

  function mergeDuplicateProjects() {
    const groups = findDuplicateProjectGroups();
    let mergedProjects = 0, movedTasks = 0;
    groups.forEach(group => {
      const sorted = group.slice().sort((a, b) => a.createdAt - b.createdAt);
      const keeper = sorted[0];
      const dupes = sorted.slice(1);
      const dupeIds = new Set(dupes.map(d => d.id));
      state.tasks.forEach(t => {
        if (dupeIds.has(t.projectId)) { t.projectId = keeper.id; movedTasks++; }
      });
      state.meetings.forEach(m => {
        m.projectIds = Array.from(new Set(m.projectIds.map(id => dupeIds.has(id) ? keeper.id : id)));
      });
      if (!keeper.links) keeper.links = [];
      dupes.forEach(d => { (d.links || []).forEach(l => keeper.links.push(l)); });
      state.projects = state.projects.filter(p => !dupeIds.has(p.id));
      mergedProjects += dupes.length;
    });
    if (mergedProjects > 0) { scheduleSave(); render(); }
    return { groups: groups.length, mergedProjects, movedTasks };
  }

  function sortTasks(list) {
    return list.slice().sort((a, b) => {
      const aDone = a.status === "done", bDone = b.status === "done";
      if (aDone !== bDone) return aDone ? 1 : -1;
      const pd = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (pd !== 0) return pd;
      return b.createdAt - a.createdAt;
    });
  }

  // ---------- due dates ----------
  function daysUntil(dueDateStr) {
    if (!dueDateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDateStr + "T00:00:00");
    return Math.round((due - today) / 86400000);
  }
  function dueBadgeHtml(t) {
    if (!t.dueDate) return "";
    const days = daysUntil(t.dueDate);
    let label, tier;
    if (days < 0) { label = `Overdue ${Math.abs(days)}d`; tier = "overdue"; }
    else if (days === 0) { label = "Due today"; tier = "soon"; }
    else if (days === 1) { label = "Due tomorrow"; tier = "soon"; }
    else if (days <= 7) { label = `Due in ${days}d`; tier = "soon"; }
    else {
      const d = new Date(t.dueDate + "T00:00:00");
      label = "Due " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      tier = "later";
    }
    return `<span class="due-badge ${tier}">${label}</span>`;
  }
  function dueSoonTasks() {
    const activeIds = new Set(activeProjects().map(p => p.id));
    return state.tasks.filter(t =>
      !t.parentId && t.status !== "done" && t.dueDate && activeIds.has(t.projectId) && daysUntil(t.dueDate) <= 7
    ).sort((a, b) => daysUntil(a.dueDate) - daysUntil(b.dueDate));
  }

  // ---------- tags ----------
  function addTagToTask(id, rawTag) {
    const tag = rawTag.trim().toLowerCase();
    if (!tag) return false;
    const t = state.tasks.find(t => t.id === id);
    if (!t.tags) t.tags = [];
    if (t.tags.includes(tag)) return false;
    t.tags.push(tag);
    scheduleSave();
    return true;
  }
  function removeTagFromTask(id, tag) {
    const t = state.tasks.find(t => t.id === id);
    t.tags = (t.tags || []).filter(x => x !== tag);
    scheduleSave();
  }
  function allTags() {
    const activeIds = new Set(activeProjects().map(p => p.id));
    const set = new Set();
    state.tasks.forEach(t => {
      if (!t.parentId && activeIds.has(t.projectId)) (t.tags || []).forEach(tag => set.add(tag));
    });
    return Array.from(set).sort();
  }
  function tagOpenCount(tag) {
    const activeIds = new Set(activeProjects().map(p => p.id));
    return state.tasks.filter(t => !t.parentId && t.status !== "done" && activeIds.has(t.projectId) && (t.tags || []).includes(tag)).length;
  }
  function tasksForTag(tag) {
    const activeIds = new Set(activeProjects().map(p => p.id));
    return sortTasks(state.tasks.filter(t => !t.parentId && activeIds.has(t.projectId) && (t.tags || []).includes(tag) && !isStaleDone(t)));
  }

  // ---------- meetings ----------
  function addMeeting(title, date, projectIds) {
    const m = { id: uid(), title: title.trim() || "Untitled meeting", date: date || todayStr(), attendees: "", projectIds: projectIds || [], lines: [], createdAt: Date.now() };
    state.meetings.push(m);
    ui.openMeetingId = m.id;
    scheduleSave(); render();
  }
  function meetingById(id) { return state.meetings.find(m => m.id === id); }
  function updateMeetingField(id, field, value) {
    const m = meetingById(id);
    m[field] = value;
    scheduleSave();
  }
  function toggleMeetingProject(meetingId, projectId) {
    const m = meetingById(meetingId);
    if (m.projectIds.includes(projectId)) m.projectIds = m.projectIds.filter(id => id !== projectId);
    else m.projectIds.push(projectId);
    scheduleSave(); render();
  }
  function addMeetingLine(meetingId, text) {
    if (!text.trim()) return;
    const m = meetingById(meetingId);
    m.lines.push({ id: uid(), text: text.trim(), taskId: null });
    scheduleSave(); render();
  }
  function deleteMeetingLine(meetingId, lineId) {
    const m = meetingById(meetingId);
    m.lines = m.lines.filter(l => l.id !== lineId);
    scheduleSave(); render();
  }
  function convertLineToTask(meetingId, lineId, projectId) {
    if (!projectId) { showToast("Pick a project first"); return; }
    const m = meetingById(meetingId);
    const line = m.lines.find(l => l.id === lineId);
    if (!line || line.taskId) return;
    const newTask = {
      id: uid(), projectId, parentId: null, title: line.text, notes: "",
      priority: "none", status: "todo", waitingOn: "", link: "", dueDate: null, tags: [], createdAt: Date.now()
    };
    state.tasks.push(newTask);
    line.taskId = newTask.id;
    justAddedId = newTask.id;
    scheduleSave(); render();
    justAddedId = null;
  }
  function duplicateMeeting(id) {
    const m = meetingById(id);
    const copy = { id: uid(), title: m.title, date: todayStr(), attendees: m.attendees, projectIds: [...m.projectIds], lines: [], createdAt: Date.now() };
    state.meetings.push(copy);
    ui.openMeetingId = copy.id;
    scheduleSave(); render();
  }
  function deleteMeeting(id) {
    const removed = meetingById(id);
    if (!removed) return;
    state.meetings = state.meetings.filter(m => m.id !== id);
    if (ui.openMeetingId === id) ui.openMeetingId = null;
    scheduleSave(); render();
    showUndoToast(`Deleted "${removed.title || "Untitled meeting"}"`, () => {
      state.meetings.push(removed);
      scheduleSave(); render();
    });
  }
  function pendingActionCount() {
    return state.meetings.reduce((sum, m) => sum + m.lines.filter(l => !l.taskId).length, 0);
  }

  // ---------- export / import ----------
  function exportData() {
    const payload = { exportedAt: new Date().toISOString(), projects: state.projects, tasks: state.tasks, meetings: state.meetings };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = `docket-export-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    meta.lastExportAt = Date.now();
    meta.lastDismissedAt = Date.now();
    saveMeta();
    showToast("Exported");
    render();
  }

  function mergeImportedPayload(parsed) {
    if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) return null;
    let addedProjects = 0, addedTasks = 0, addedMeetings = 0, skipped = 0;
    parsed.projects.map(migrateProject).forEach(p => {
      if (state.projects.find(existing => existing.id === p.id)) { skipped++; return; }
      state.projects.push(p); addedProjects++;
    });
    parsed.tasks.map(migrateTask).forEach(t => {
      if (state.tasks.find(existing => existing.id === t.id)) { skipped++; return; }
      state.tasks.push(t); addedTasks++;
    });
    (parsed.meetings || []).map(migrateMeeting).forEach(m => {
      if (state.meetings.find(existing => existing.id === m.id)) { skipped++; return; }
      state.meetings.push(m); addedMeetings++;
    });
    scheduleSave();
    render();
    return { addedProjects, addedTasks, addedMeetings, skipped };
  }

  function importDataFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { showToast("That file isn't valid JSON"); return; }
      const result = mergeImportedPayload(parsed);
      if (!result) { showToast("That file doesn't look like a Docket export"); return; }
      showToast(`Imported ${result.addedProjects} project(s), ${result.addedTasks} task(s), ${result.addedMeetings} meeting(s)${result.skipped ? `, skipped ${result.skipped} already present` : ""}`);
    };
    reader.readAsText(file);
  }

  // ---------- GitHub sync (private repo, two-way) ----------
  const SYNC_FILE_PATH = "docket-data.json";
  const SYNC_API_VERSION = "2022-11-28";
  let syncPushInFlight = false;
  let syncPushQueued = false;

  function syncConfigured() { return !!(meta.syncToken && meta.repoOwner && meta.repoName); }

  function syncHeaders() {
    return {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + meta.syncToken.trim(),
      "X-GitHub-Api-Version": SYNC_API_VERSION
    };
  }

  async function githubErrorDetail(res) {
    try {
      const data = await res.json();
      return data && data.message ? `${res.status}: ${data.message}` : String(res.status);
    } catch (e) {
      return String(res.status);
    }
  }

  function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function base64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

  function currentPayloadJson() {
    return JSON.stringify({ exportedAt: new Date().toISOString(), updatedAt: state.updatedAt, projects: state.projects, tasks: state.tasks, meetings: state.meetings }, null, 2);
  }

  function applySyncSnapshot(parsed) {
    if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) return null;
    state.projects = parsed.projects.map(migrateProject);
    state.tasks = parsed.tasks.map(migrateTask);
    state.meetings = (parsed.meetings || []).map(migrateMeeting);
    state.updatedAt = parsed.updatedAt || state.updatedAt;
    scheduleSaveOnly();
    render();
    return true;
  }

  async function ensureRepoExists() {
    const check = await fetch(`https://api.github.com/repos/${meta.repoOwner}/${meta.repoName}`, { headers: syncHeaders(), cache: "no-store" });
    if (check.ok) return true;
    if (check.status !== 404) throw new Error(`Couldn't check repo (${check.status})`);
    const create = await fetch("https://api.github.com/user/repos", {
      method: "POST", headers: syncHeaders(),
      body: JSON.stringify({ name: meta.repoName, private: true, auto_init: true, description: "Private data store for the Docket app \u2014 not browsable, just JSON." })
    });
    if (!create.ok) throw new Error(`Couldn't create repo (${create.status})`);
    return true;
  }

  async function syncPush() {
    if (!syncConfigured()) return;
    if (syncPushInFlight) { syncPushQueued = true; return; }
    syncPushInFlight = true;
    try {
      let res, attempts = 0;
      while (attempts < 4) {
        attempts++;
        const body = { message: "Docket sync", content: utf8ToBase64(currentPayloadJson()) };
        if (meta.fileSha) body.sha = meta.fileSha;
        res = await fetch(`https://api.github.com/repos/${meta.repoOwner}/${meta.repoName}/contents/${SYNC_FILE_PATH}`, {
          method: "PUT", headers: syncHeaders(), body: JSON.stringify(body), cache: "no-store"
        });
        if (res.ok) break;
        if (res.status !== 409 && res.status !== 422) break;
        // Someone else (another open copy) wrote first — pull their changes in, merge, then retry with the fresh sha.
        await syncPull();
      }
      if (!res.ok) throw new Error(`GitHub responded ${await githubErrorDetail(res)}`);
      const data = await res.json();
      meta.fileSha = data.content.sha;
      meta.lastSyncAt = Date.now();
      meta.lastSyncError = null;
      saveMeta();
    } catch (e) {
      console.error("Docket: sync push failed —", e);
      meta.lastSyncError = e.message || "Unknown error";
      saveMeta();
    } finally {
      syncPushInFlight = false;
      if (syncPushQueued) { syncPushQueued = false; syncPush(); }
    }
  }

  let syncPullPromise = null;
  async function syncPull(opts) {
    opts = opts || {};
    if (!syncConfigured()) { if (opts.manual) showToast("Not connected yet"); return; }
    if (syncPullPromise) return syncPullPromise;
    syncPullPromise = (async () => {
      try {
        const res = await fetch(`https://api.github.com/repos/${meta.repoOwner}/${meta.repoName}/contents/${SYNC_FILE_PATH}?_=${Date.now()}`, { headers: syncHeaders(), cache: "no-store" });
        if (res.status === 404) {
          if (opts.manual) showToast("Nothing synced yet \u2014 make a change first");
          return;
        }
        if (!res.ok) throw new Error(`GitHub responded ${await githubErrorDetail(res)}`);
        const data = await res.json();
        meta.fileSha = data.sha; // always keep the sha bookkeeping current, even if we don't adopt the content below
        const parsed = JSON.parse(base64ToUtf8(data.content));
        const remoteUpdatedAt = parsed.updatedAt || 0;
        let adopted = false;
        if (remoteUpdatedAt > (state.updatedAt || 0)) {
          adopted = !!applySyncSnapshot(parsed);
        }
        meta.lastSyncAt = Date.now();
        meta.lastSyncError = null;
        saveMeta();
        if (opts.manual) {
          showToast(adopted ? "Synced \u2014 pulled in newer changes" : "Already up to date");
        }
      } catch (e) {
        console.error("Docket: sync pull failed —", e);
        meta.lastSyncError = e.message || "Unknown error";
        saveMeta();
        if (opts.manual) showToast("Sync failed — see console for details");
      } finally {
        syncPullPromise = null;
      }
    })();
    return syncPullPromise;
  }

  async function connectSync(token, repoName) {
    meta.syncToken = token.trim();
    meta.repoName = (repoName || "docket-data").trim();
    try {
      const who = await fetch("https://api.github.com/user", { headers: syncHeaders(), cache: "no-store" });
      if (!who.ok) throw new Error("That token didn't work (couldn't verify your GitHub account)");
      const whoData = await who.json();
      meta.repoOwner = whoData.login;
      await ensureRepoExists();
      await syncPull();
      await syncPush();
      meta.lastSyncError = null;
      saveMeta();
      return true;
    } catch (e) {
      console.error("Docket: connecting sync failed —", e);
      meta.lastSyncError = e.message || "Unknown error";
      saveMeta();
      return false;
    }
  }

  function disconnectSync() {
    meta.syncToken = null; meta.repoOwner = null; meta.repoName = null;
    meta.fileSha = null; meta.lastSyncAt = null; meta.lastSyncError = null;
    saveMeta();
  }

  function shouldShowReminder() {
    const hasData = state.tasks.length > 0 || state.meetings.length > 0 || state.projects.some(p => p.category !== "initiative");
    if (!hasData) return false;
    const since = meta.lastDismissedAt || meta.lastExportAt;
    if (!since) return true;
    return (Date.now() - since) > REMIND_INTERVAL_MS;
  }

  function dismissReminder() {
    meta.lastDismissedAt = Date.now();
    saveMeta();
    render();
  }

  // ---------- rendering ----------
  function render() { renderSidebar(); renderMain(); }

  function renderSidebar() {
    function projectItem(p) {
      const active = ui.selected === p.id ? " active" : "";
      const nameBlock = isCourseProject(p) && p.courseCode
        ? `<div class="project-name-block"><div class="project-name">${escapeHtml(p.courseCode)}</div><div class="project-name-sub">${escapeHtml(p.name)}</div></div>`
        : `<div class="project-name">${escapeHtml(p.name)}</div>`;
      return `<div class="project-item${active}" data-project="${p.id}" title="${escapeHtml(p.name)}">
        ${projectIconHtml(p)}
        ${nameBlock}
        <div class="project-count">${openCount(p.id)}</div>
      </div>`;
    }

    const groupsHtml = GROUPS.map(g => {
      const items = activeProjects().filter(p => p.category === g.key);
      return `<div>
        <div class="group-label">${g.label}</div>
        ${items.map(projectItem).join("")}
        <button class="add-project-btn" data-addproject="${g.key}">${g.addLabel}</button>
      </div>`;
    }).join("");

    const tags = allTags();
    const tagsHtml = tags.length ? `<div>
      <div class="group-label">Tags</div>
      ${tags.map(tag => `<div class="project-item${ui.selected === "tag:" + tag ? " active" : ""}" data-tagnav="${escapeHtml(tag)}">
        <div class="project-icon tag-hash">#</div>
        <div class="project-name">${escapeHtml(tag)}</div>
        <div class="project-count">${tagOpenCount(tag)}</div>
      </div>`).join("")}
    </div>` : "";

    const lastExportLabel = meta.lastExportAt
      ? `Last export: ${new Date(meta.lastExportAt).toLocaleDateString()}`
      : "Never exported";

    const dueCount = dueSoonTasks().length;
    const pendingCount = pendingActionCount();

    sidebarEl.innerHTML = `
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">Docket</div></div>
      <div class="nav-btn${ui.selected === "home" ? " active" : ""}" data-nav="home"><span>Dashboard</span></div>
      <div class="nav-btn${ui.selected === "duesoon" ? " active" : ""}" data-nav="duesoon"><span>Due soon</span>${dueCount ? `<span class="project-count">${dueCount}</span>` : ""}</div>
      <div class="nav-btn${ui.selected === "meetings" ? " active" : ""}" data-nav="meetings"><span>Meetings</span>${pendingCount ? `<span class="project-count">${pendingCount}</span>` : ""}</div>
      ${groupsHtml}
      ${tagsHtml}
      <div class="sidebar-footer">
        <button class="footer-link" data-export>Export data</button>
        <button class="footer-link" data-import>Import data</button>
        <div class="footer-meta">${lastExportLabel}</div>
        <button class="footer-link" data-github-backup>GitHub sync${syncConfigured() ? (meta.lastSyncError ? " (error)" : " \u2713") : ""}</button>
        ${archivedProjects().length ? `<button class="footer-link" data-view-archived>Archived projects (${archivedProjects().length})</button>` : ""}
        ${findDuplicateProjectGroups().length ? `<button class="footer-link" data-merge-dupes style="color:var(--waiting);">Merge duplicate projects (${findDuplicateProjectGroups().length})</button>` : ""}
        <button class="footer-link danger" data-clearall>Clear all data</button>
      </div>
    `;

    sidebarEl.querySelectorAll("[data-project]").forEach(el => {
      el.addEventListener("click", () => { ui.selected = el.dataset.project; ui.openTaskId = null; mainEl.scrollTop = 0; render(); });
    });
    sidebarEl.querySelector('[data-nav="home"]').addEventListener("click", () => {
      ui.selected = "home"; ui.openTaskId = null; mainEl.scrollTop = 0; render();
    });
    sidebarEl.querySelector('[data-nav="duesoon"]').addEventListener("click", () => {
      ui.selected = "duesoon"; ui.openTaskId = null; mainEl.scrollTop = 0; render();
    });
    sidebarEl.querySelector('[data-nav="meetings"]').addEventListener("click", () => {
      ui.selected = "meetings"; ui.openTaskId = null; mainEl.scrollTop = 0; render();
    });
    sidebarEl.querySelectorAll("[data-tagnav]").forEach(el => {
      el.addEventListener("click", () => navigateToTag(el.dataset.tagnav));
    });
    sidebarEl.querySelectorAll("[data-addproject]").forEach(el => {
      el.addEventListener("click", () => openProjectModal(el.dataset.addproject, el));
    });
    sidebarEl.querySelector("[data-clearall]").addEventListener("click", (e) => openClearAllModal(e.currentTarget));
    sidebarEl.querySelector("[data-export]").addEventListener("click", exportData);
    sidebarEl.querySelector("[data-import]").addEventListener("click", () => importInput.click());
    sidebarEl.querySelector("[data-github-backup]").addEventListener("click", (e) => openGithubSyncModal(e.currentTarget));
    const viewArchivedBtn = sidebarEl.querySelector("[data-view-archived]");
    if (viewArchivedBtn) viewArchivedBtn.addEventListener("click", () => openArchivedProjectsModal(viewArchivedBtn));
    const mergeDupesBtn = sidebarEl.querySelector("[data-merge-dupes]");
    if (mergeDupesBtn) mergeDupesBtn.addEventListener("click", () => {
      const result = mergeDuplicateProjects();
      showToast(`Merged ${result.mergedProjects} duplicate project(s), moved ${result.movedTasks} task(s) \u2014 nothing was deleted`);
    });
  }

  function taskRowHtml(t, opts) {
    opts = opts || {};
    const subs = subtasksFor(t.id);
    const openSubs = subs.filter(s => s.status !== "done").length;
    const isOpen = ui.openTaskId === t.id;
    const proj = projectById(t.projectId);
    const priClass = t.priority !== "none" ? " " + t.priority : "";
    const notesPreview = t.notes ? escapeHtml(t.notes.split("\n")[0]) : "";

    return `
      <div class="task-row${t.status === "done" ? " done" : ""}${isOpen ? " open" : ""}${t.id === justAddedId ? " just-added" : ""}"${opts.board ? ' draggable="true"' : ""} data-task="${t.id}">
        <div class="task-main">
          ${opts.board ? "" : `<button class="checkbox${t.status === "done" ? " checked" : ""}" data-toggle="${t.id}"></button>`}
          <button class="priority-pill${priClass}" data-priority="${t.id}" title="Priority: ${t.priority === "none" ? "none" : t.priority}">${PRIORITY_LABEL[t.priority]}</button>
          <div class="task-body" data-open="${t.id}">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-meta">
              ${opts.showProject ? `<span class="task-meta-note" style="font-weight:600" title="${escapeHtml(proj.name)}">${escapeHtml(projectShortLabel(proj))}</span>` : ""}
              ${t.status === "in_progress" ? `<span class="status-badge in_progress">in progress</span>` : ""}
              ${t.status === "waiting" ? `<span class="status-badge waiting">waiting${t.waitingOn ? " on " + escapeHtml(t.waitingOn) : ""}</span>` : ""}
              ${dueBadgeHtml(t)}
              ${notesPreview ? `<span class="notes-preview">${notesPreview}</span>` : ""}
              ${subs.length ? `<span class="subtask-count">${subs.length - openSubs}/${subs.length} subtasks</span>` : ""}
              ${t.link ? `<a class="link-chip" href="${escapeHtml(t.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">link \u2197</a>` : ""}
              ${(t.tags || []).map(tag => `<span class="tag-pill" data-tagnav="${escapeHtml(tag)}" onclick="event.stopPropagation()">#${escapeHtml(tag)}</span>`).join("")}
            </div>
          </div>
          <div class="row-actions">
            ${opts.board ? `<button class="mini-btn" data-move-prev="${t.id}" title="Move left">\u2039</button><button class="mini-btn" data-move-next="${t.id}" title="Move right">\u203a</button>` : ""}
            <button class="mini-btn danger" data-delete="${t.id}">delete</button>
          </div>
        </div>
        <div class="task-detail-wrap${isOpen ? " open" : ""}">
          <div class="task-detail">
            <div class="detail-row">
              <div class="detail-field">
                <label>Status</label>
                <select data-status="${t.id}">
                  ${Object.keys(STATUS_LABEL).map(s => `<option value="${s}"${t.status === s ? " selected" : ""}>${STATUS_LABEL[s]}</option>`).join("")}
                </select>
              </div>
              <div class="detail-field">
                <label>Priority</label>
                <select data-priority-select="${t.id}">
                  ${Object.keys(PRIORITY_FULL_LABEL).map(p => `<option value="${p}"${t.priority === p ? " selected" : ""}>${PRIORITY_FULL_LABEL[p]}</option>`).join("")}
                </select>
              </div>
              ${t.status === "waiting" ? `
              <div class="detail-field">
                <label>Waiting on</label>
                <input type="text" placeholder="e.g. instructor reply" value="${escapeHtml(t.waitingOn || "")}" data-waitingon="${t.id}">
              </div>` : ""}
              <div class="detail-field">
                <label>Due date</label>
                <input type="date" value="${t.dueDate || ""}" data-duedate="${t.id}">
              </div>
              <div class="detail-field">
                <label>Link</label>
                <input type="text" placeholder="Monday.com item, doc, etc." value="${escapeHtml(t.link || "")}" data-link="${t.id}" style="min-width:220px">
              </div>
            </div>
            <div class="detail-field">
              <label>Tags</label>
              <div class="tag-editor" data-tag-editor="${t.id}">
                ${(t.tags || []).map(tag => `<span class="tag-chip">#${escapeHtml(tag)}<button type="button" data-tag-remove="${t.id}|${escapeHtml(tag)}">\u00d7</button></span>`).join("")}
                <input type="text" class="tag-input" placeholder="Add tag\u2026" data-tag-input="${t.id}">
                <button type="button" class="mini-add-btn" data-tag-add-btn="${t.id}">+</button>
              </div>
            </div>
            <textarea class="task-notes" placeholder="Notes\u2026 what you looked into, where things stand, links" data-notes="${t.id}">${escapeHtml(t.notes || "")}</textarea>
            <div class="subtasks">
              ${sortTasks(subs).map(s => `
                <div class="subtask-row${s.status === "done" ? " done" : ""}">
                  <button class="checkbox${s.status === "done" ? " checked" : ""}" data-toggle="${s.id}"></button>
                  <div class="subtask-title">${escapeHtml(s.title)}</div>
                  <button class="mini-btn danger" data-delete="${s.id}">\u00d7</button>
                </div>
              `).join("")}
              <div class="subtask-add"><input type="text" placeholder="Add subtask\u2026" data-subtask-input="${t.id}"><button type="button" class="mini-add-btn" data-subtask-add-btn="${t.id}">+</button></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function kanbanBoardHtml(taskList, opts) {
    opts = opts || {};
    const cols = Object.keys(STATUS_LABEL).map(status => {
      const items = sortTasks(taskList.filter(t => t.status === status));
      return `
        <div class="kanban-column" data-column="${status}">
          <div class="kanban-column-header"><span>${STATUS_LABEL[status]}</span><span class="project-count">${items.length}</span></div>
          <div class="kanban-cards">
            ${items.length ? items.map(t => taskRowHtml(t, { board: true, showProject: opts.showProject })).join("") : `<div class="kanban-empty">Nothing here</div>`}
          </div>
        </div>
      `;
    }).join("");
    return `<div class="kanban-board">${cols}</div>`;
  }

  function bindKanbanDnD() {
    let draggedId = null;
    mainInnerEl.querySelectorAll('.task-row[draggable="true"]').forEach(row => {
      row.addEventListener("dragstart", e => {
        draggedId = row.dataset.task;
        row.classList.add("dragging");
        if (e.dataTransfer) { e.dataTransfer.setData("text/plain", draggedId); e.dataTransfer.effectAllowed = "move"; }
      });
      row.addEventListener("dragend", () => { row.classList.remove("dragging"); });
    });
    mainInnerEl.querySelectorAll(".kanban-column").forEach(col => {
      col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", e => {
        e.preventDefault();
        col.classList.remove("drag-over");
        if (draggedId) setStatus(draggedId, col.dataset.column);
        draggedId = null;
      });
    });
  }

  function bannerHtml() {
    if (!shouldShowReminder()) return "";
    return `
      <div class="reminder-banner">
        <div>It's been a while since your last export \u2014 worth downloading a backup.</div>
        <div class="reminder-banner-actions">
          <button data-banner-dismiss>Not now</button>
          <button class="primary" data-banner-export>Export now</button>
        </div>
      </div>
    `;
  }

  function navigateToTag(tag) {
    ui.selected = "tag:" + tag;
    ui.openTaskId = null;
    mainEl.scrollTop = 0;
    render();
  }

  function renderMain() {
    if (ui.selected === "home") {
      topbarEl.innerHTML = topbarHomeHtml();
      mainInnerEl.innerHTML = bannerHtml() + bodyHomeHtml();
    } else if (ui.selected === "duesoon") {
      topbarEl.innerHTML = topbarDueSoonHtml();
      mainInnerEl.innerHTML = bannerHtml() + bodyDueSoonHtml();
    } else if (ui.selected === "meetings") {
      topbarEl.innerHTML = topbarMeetingsHtml();
      mainInnerEl.innerHTML = bannerHtml() + bodyMeetingsHtml();
    } else if (ui.selected.indexOf("tag:") === 0) {
      const tag = ui.selected.slice(4);
      topbarEl.innerHTML = topbarTagHtml(tag);
      mainInnerEl.innerHTML = bannerHtml() + bodyTagHtml(tag);
    } else {
      const p = projectById(ui.selected);
      if (!p) { ui.selected = "home"; return renderMain(); }
      topbarEl.innerHTML = topbarProjectHtml(p);
      mainInnerEl.innerHTML = bannerHtml() + bodyProjectHtml(p);
    }
    mainInnerEl.classList.toggle("wide", ui.selected === "home" || (projectById(ui.selected) && ui.viewMode === "board"));
    bindTopbarEvents();
    bindMainEvents();
    bindKanbanDnD();
    if (ui.selected === "meetings") bindMeetingsEvents();
  }

  function viewToggleHtml() {
    return `
      <div class="view-toggle">
        <button class="${ui.viewMode === "list" ? "active" : ""}" data-viewmode="list">List</button>
        <button class="${ui.viewMode === "board" ? "active" : ""}" data-viewmode="board">Board</button>
      </div>
    `;
  }

  const PIN_ICON = '<svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M235.32,81.37,174.63,20.69a16,16,0,0,0-22.63,0L98.37,74.49c-10.66-3.34-35-7.37-60.4,13.14a16,16,0,0,0-1.29,23.78L85,159.71,42.34,202.34a8,8,0,0,0,11.32,11.32L96.29,171l48.29,48.29A16,16,0,0,0,155.9,224c.38,0,.75,0,1.13,0a15.93,15.93,0,0,0,11.64-6.33c19.64-26.1,17.75-47.32,13.19-60L235.33,104A16,16,0,0,0,235.32,81.37ZM224,92.69h0l-57.27,57.46a8,8,0,0,0-1.49,9.22c9.46,18.93-1.8,38.59-9.34,48.62L48,100.08c12.08-9.74,23.64-12.31,32.48-12.31A40.13,40.13,0,0,1,96.81,91a8,8,0,0,0,9.25-1.51L163.32,32,224,92.68Z"/></svg>';

  function dashboardCardHtml(p) {
    const heading = projectNameBlockHtml(p, "dash-card-name", "dash-card-subtitle");
    const linkRows = p.links.map(l => `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="dash-link-btn" onclick="event.stopPropagation()">${escapeHtml(l.label)}</a>`).join("");
    const ghostRow = p.links.length < 4
      ? `<button type="button" class="dash-link-ghost" data-quick-edit-links="${p.id}" onclick="event.stopPropagation()">+ Add link</button>`
      : "";
    const openN = openCount(p.id);
    return `
      <div class="dash-card" draggable="true" data-home-card="${p.id}" data-drag-project="${p.id}">
        <button class="dash-pin-btn" data-unpin="${p.id}" title="Remove from Dashboard" onclick="event.stopPropagation()">${PIN_ICON}</button>
        <div class="dash-card-main">
          ${projectIconHtml(p)}
          <div class="dash-card-text">${heading}</div>
        </div>
        <div class="dash-card-links">${linkRows}${ghostRow}</div>
        <div class="dash-card-footer">${openN} open</div>
      </div>
    `;
  }

  function topbarHomeHtml() {
    return `
      <div>
        <div class="main-title">Dashboard</div>
        <div class="main-sub">Pinned projects and everything currently in motion</div>
      </div>
    `;
  }

  function bodyHomeHtml() {
    const pinned = pinnedProjects();
    const cardsHtml = pinned.length
      ? `<div class="dash-cards-mask">
          <div class="dash-cards" id="dash-cards">${pinned.map(dashboardCardHtml).join("")}</div>
        </div>`
      : `<div class="empty-state-sub" style="padding:4px 2px 20px;">Nothing pinned yet \u2014 pin a project from its edit screen in the sidebar to feature it here.</div>`;

    const projects = activeProjects();
    const anyTasks = state.tasks.some(t => !t.parentId);
    const quickAdd = `
      <div class="quick-add">
        <select id="qa-project">${projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select>
        <input type="text" id="qa-input" placeholder="Add a task to the selected project\u2026">
        <button id="qa-btn">Add</button>
      </div>
    `;

    const board = anyTasks
      ? kanbanBoardHtml(projects.flatMap(p => tasksFor(p.id)), { showProject: true })
      : `<div class="empty-state"><div class="empty-state-title">Nothing tracked yet</div><div class="empty-state-sub">Add a task above to get started.</div></div>`;

    return `
      ${cardsHtml}
      <div class="home-dashboard-label">Tasks</div>
      ${quickAdd}
      ${board}
    `;
  }

  function topbarDueSoonHtml() {
    return `
      <div>
        <div class="main-title">Due soon</div>
        <div class="main-sub">Overdue and due within the next 7 days, across every project</div>
      </div>
    `;
  }

  function bodyDueSoonHtml() {
    const list = dueSoonTasks();
    if (!list.length) {
      return `<div class="empty-state"><div class="empty-state-title">Nothing due soon</div><div class="empty-state-sub">Tasks with a due date in the next 7 days (or overdue) show up here.</div></div>`;
    }
    return `<div class="task-list">${list.map(t => taskRowHtml(t, { showProject: true })).join("")}</div>`;
  }

  function topbarTagHtml(tag) {
    return `
      <div>
        <div class="main-title">#${escapeHtml(tag)}</div>
        <div class="main-sub">Every task tagged #${escapeHtml(tag)}, across every project</div>
      </div>
    `;
  }

  function bodyTagHtml(tag) {
    const list = tasksForTag(tag);
    if (!list.length) {
      return `<div class="empty-state"><div class="empty-state-title">No tasks with this tag</div><div class="empty-state-sub">Tag a task and it'll show up here.</div></div>`;
    }
    return `<div class="task-list">${list.map(t => taskRowHtml(t, { showProject: true })).join("")}</div>`;
  }

  function topbarMeetingsHtml() {
    return `
      <div>
        <div class="main-title">Meetings</div>
        <div class="main-sub">Notes from meetings, with a quick way to turn a line into a task</div>
      </div>
      <div class="header-actions"><button class="icon-btn" id="new-meeting-btn">+ New meeting</button></div>
    `;
  }

  function bodyMeetingsHtml() {
    const meetings = state.meetings.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt - a.createdAt);
    if (!meetings.length) {
      return `<div class="empty-state"><div class="empty-state-title">No meetings logged yet</div><div class="empty-state-sub">Click "New meeting" above to start one.</div></div>`;
    }
    return `<div class="task-list">${meetings.map(meetingRowHtml).join("")}</div>`;
  }

  function meetingRowHtml(m) {
    const isOpen = ui.openMeetingId === m.id;
    const linkedProjects = m.projectIds.map(projectById).filter(Boolean);
    const pending = m.lines.filter(l => !l.taskId).length;
    const dateLabel = m.date ? new Date(m.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "no date";

    return `
      <div class="task-row${isOpen ? " open" : ""}" data-meeting="${m.id}">
        <div class="task-main">
          <div class="task-body" data-openmeeting="${m.id}">
            <div class="task-title">${escapeHtml(m.title || "Untitled meeting")}</div>
            <div class="task-meta">
              <span class="task-meta-note">${dateLabel}</span>
              ${linkedProjects.map(p => `<span class="task-meta-note" style="font-weight:600" title="${escapeHtml(p.name)}">${escapeHtml(projectShortLabel(p))}</span>`).join("")}
              ${pending ? `<span class="status-badge waiting">${pending} to convert</span>` : ""}
            </div>
          </div>
          <div class="row-actions">
            <button class="mini-btn" data-duplicate-meeting="${m.id}">duplicate</button>
            <button class="mini-btn danger" data-delete-meeting="${m.id}">delete</button>
          </div>
        </div>
        <div class="task-detail-wrap${isOpen ? " open" : ""}">
          <div class="task-detail">
            <div class="detail-row">
              <div class="detail-field">
                <label>Title</label>
                <input type="text" value="${escapeHtml(m.title || "")}" data-meeting-title="${m.id}" style="min-width:220px">
              </div>
              <div class="detail-field">
                <label>Date</label>
                <input type="date" value="${m.date || ""}" data-meeting-date="${m.id}">
              </div>
              <div class="detail-field" style="flex:1 1 220px">
                <label>Attendees</label>
                <input type="text" placeholder="Who was there" value="${escapeHtml(m.attendees || "")}" data-meeting-attendees="${m.id}">
              </div>
            </div>
            <div class="detail-field">
              <label>Projects this covers <span style="font-weight:400;color:var(--faint)">(none, one, or several)</span></label>
              <div class="tag-editor">
                ${activeProjects().map(p => `<button type="button" class="tag-chip-toggle${m.projectIds.includes(p.id) ? " on" : ""}" data-toggle-meeting-project="${m.id}|${p.id}">${escapeHtml(p.name)}</button>`).join("") || `<span class="empty-state-sub">No active projects yet</span>`}
              </div>
            </div>
            <div class="detail-field">
              <label>Notes / action items</label>
              <div class="meeting-lines">
                ${m.lines.map(l => meetingLineHtml(m, l)).join("")}
                <div class="subtask-add"><input type="text" placeholder="Add a note line\u2026" data-meeting-line-input="${m.id}"><button type="button" class="mini-add-btn" data-meeting-line-add-btn="${m.id}">+</button></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function meetingLineHtml(m, l) {
    if (l.taskId) {
      const t = state.tasks.find(t => t.id === l.taskId);
      const proj = t ? projectById(t.projectId) : null;
      return `
        <div class="meeting-line done">
          <div class="subtask-title" style="text-decoration:line-through;color:var(--faint)">${escapeHtml(l.text)}</div>
          <span class="task-meta-note">\u2713 added${proj ? " to " + escapeHtml(proj.name) : ""}</span>
        </div>
      `;
    }
    const linkedProjects = m.projectIds.map(projectById).filter(Boolean);
    const defaultProjectId = linkedProjects[0] ? linkedProjects[0].id : "";
    return `
      <div class="meeting-line">
        <div class="subtask-title">${escapeHtml(l.text)}</div>
        <select class="line-project-select" data-line-project="${m.id}|${l.id}">
          <option value="">Choose project\u2026</option>
          ${activeProjects().map(p => `<option value="${p.id}"${p.id === defaultProjectId ? " selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
        </select>
        <button type="button" class="mini-btn" data-convert-line="${m.id}|${l.id}">\u2192 Task</button>
        <button type="button" class="mini-btn danger" data-delete-line="${m.id}|${l.id}">\u00d7</button>
      </div>
    `;
  }

  function topbarProjectHtml(p) {
    const catLabel = p.category === "collaborative" ? "Collaborative course" : p.category === "contracted" ? "Contracted service" : "Initiative";
    const showCode = isCourseProject(p) && p.courseCode;
    const sub = showCode
      ? `${escapeHtml(p.name)} \u00b7 ${catLabel} \u00b7 ${openCount(p.id)} open`
      : `${catLabel} \u00b7 ${openCount(p.id)} open`;
    return `
      <div class="main-title-row" style="display:block">
        <div style="display:flex;align-items:center;gap:10px;">
          ${projectIconHtml(p)}
          <div class="main-title">${escapeHtml(showCode ? p.courseCode : p.name)}</div>
        </div>
        <div class="main-sub">${sub}</div>
      </div>
      <div class="header-actions">
        ${viewToggleHtml()}
        <button class="icon-btn" data-edit-project="${p.id}">edit</button>
        <button class="icon-btn" data-archive-project="${p.id}">archive</button>
      </div>
    `;
  }

  function bodyProjectHtml(p) {
    const list = sortTasks(tasksFor(p.id));
    const isCourse = p.category === "collaborative" || p.category === "contracted";

    const courseInfo = isCourse ? `
      <div class="course-info">
        <div class="course-info-field"><div class="course-info-label">Course code</div><div class="course-info-value${p.courseCode ? "" : " empty"}">${p.courseCode ? escapeHtml(p.courseCode) : "not set"}</div></div>
        <div class="course-info-field"><div class="course-info-label">Instructor</div><div class="course-info-value${p.instructorName ? "" : " empty"}">${p.instructorName ? escapeHtml(p.instructorName) : "not set"}</div></div>
        <div class="course-info-field"><div class="course-info-label">Instructor email</div><div class="course-info-value${p.instructorEmail ? "" : " empty"}">${p.instructorEmail ? `<a href="mailto:${escapeHtml(p.instructorEmail)}">${escapeHtml(p.instructorEmail)}</a>` : "not set"}</div></div>
        <div class="course-info-field"><div class="course-info-label">Instructional designer</div><div class="course-info-value${p.idName ? "" : " empty"}">${p.idName ? escapeHtml(p.idName) : "not set"}</div></div>
        <div class="course-info-field"><div class="course-info-label">ID email</div><div class="course-info-value${p.idEmail ? "" : " empty"}">${p.idEmail ? `<a href="mailto:${escapeHtml(p.idEmail)}">${escapeHtml(p.idEmail)}</a>` : "not set"}</div></div>
      </div>
    ` : "";

    return `
      ${courseInfo}
      <div class="quick-add">
        <input type="text" id="qa-input" placeholder="Add a task\u2026">
        <button id="qa-btn">Add</button>
      </div>
      ${list.length ? (ui.viewMode === "board" ? kanbanBoardHtml(list) : `<div class="task-list">${list.map(t => taskRowHtml(t)).join("")}</div>`) : `<div class="empty-state"><div class="empty-state-title">No tasks yet</div><div class="empty-state-sub">Add the first one above.</div></div>`}
    `;
  }

  function bindTopbarEvents() {
    const editBtn = topbarEl.querySelector("[data-edit-project]");
    if (editBtn) editBtn.addEventListener("click", () => openProjectInfoModal(projectById(editBtn.dataset.editProject), editBtn));

          card.classList.toggle("drag-after", e.clientX >= rect.left + rect.width / 2);
        });
        card.addEventListener("dragleave", () => card.classList.remove("drag-before", "drag-after"));

  function iconPickerHtml(selectedIcon) {
    const items = Object.keys(ICON_LIBRARY).map(name => {
      const sel = selectedIcon === name ? " selected" : "";
      return `<button type="button" class="icon-pick${sel}" data-icon-pick="${name}" title="${name.replace(/-/g, " ")}">${ICON_LIBRARY[name]}</button>`;

    return `<label>Icon <span style="font-weight:400;color:var(--faint)">(optional \u2014 defaults to the category icon)</span></label><div class="icon-picker">${items}</div>`;
  }
  function bindIconPicker(container, initial) {
    let selected = initial || null;
    container.querySelectorAll("[data-icon-pick]").forEach(btn => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.iconPick;
        selected = selected === name ? null : name;
        container.querySelectorAll("[data-icon-pick]").forEach(b => b.classList.toggle("selected", b.dataset.iconPick === selected));
      });
    });
    return () => selected;
  }

  function showModal(html, triggerEl) {
    modalSlot.innerHTML = html;
    const backdrop = modalSlot.querySelector(".modal-backdrop");
    const modal = modalSlot.querySelector(".modal");
    if (triggerEl && modal) {
      const tr = triggerEl.getBoundingClientRect();
      const originX = tr.left + tr.width / 2;
      const originY = tr.top + tr.height / 2;
      requestAnimationFrame(() => {
        const mr = modal.getBoundingClientRect();
        modal.style.transformOrigin = `${originX - mr.left}px ${originY - mr.top}px`;
      });
    }
    backdrop.classList.add("entering");
    requestAnimationFrame(() => requestAnimationFrame(() => backdrop.classList.remove("entering")));
    backdrop.addEventListener("click", e => { if (e.target === backdrop) closeModal(); });
    return modal;
  }

  function closeModal() {
    const backdrop = modalSlot.querySelector(".modal-backdrop");
    if (!backdrop) { modalSlot.innerHTML = ""; return; }
    backdrop.classList.add("leaving");
    setTimeout(() => { modalSlot.innerHTML = ""; }, 300);
  }

  function relativeTimeLabel(ts) {
    if (!ts) return null;
    const mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours} hr ago`;
    return new Date(ts).toLocaleDateString();
  }

  function openGithubSyncModal(triggerEl) {
    const tokenUrl = "https://github.com/settings/tokens/new?scopes=repo&description=Docket%20sync";
    const render_ = () => {
      const connected = syncConfigured();
      const statusLine = !connected
        ? "Not connected \u2014 sync is off."
        : meta.lastSyncError
          ? `Connected, but the last attempt failed: ${escapeHtml(meta.lastSyncError)}`
          : meta.lastSyncAt
            ? `Connected to ${escapeHtml(meta.repoOwner)}/${escapeHtml(meta.repoName)} \u2014 last synced ${relativeTimeLabel(meta.lastSyncAt)}.`
            : `Connected to ${escapeHtml(meta.repoOwner)}/${escapeHtml(meta.repoName)} \u2014 not synced yet.`;
      modalSlot.querySelector(".modal").innerHTML = `
        <h3>GitHub sync</h3>
        <p class="hint">Every change pushes to a private repository in your GitHub account immediately. Each copy checks GitHub for the latest version once, when it's opened, so whichever you open next always starts current, there's no ongoing background syncing while it's sitting open. Use "Sync now" below to check on demand without reopening. <a href="${tokenUrl}" target="_blank" rel="noopener" style="color:var(--accent-text)">Create a token scoped to "repo" only</a>, then paste it below.</p>
        <label>Personal access token</label>
        <input type="password" id="gb-token" placeholder="${connected ? "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022 (saved \u2014 paste a new one to replace)" : "ghp_..."}">
        <label>Repository name <span style="font-weight:400;color:var(--faint)">(created automatically if it doesn't exist)</span></label>
        <input type="text" id="gb-repo" value="${connected ? escapeHtml(meta.repoName) : "docket-data"}">
        <p class="hint" style="margin-top:10px;color:${meta.lastSyncError && connected ? "var(--danger)" : "var(--faint)"}">${statusLine}</p>
        <div class="modal-actions">
          <button id="gb-close">Close</button>
          ${connected ? `<button id="gb-disconnect" class="danger">Disconnect</button>` : ""}
          ${connected ? `<button id="gb-restore">Sync now</button>` : ""}
          <button class="primary" id="gb-save">${connected ? "Update" : "Connect"}</button>
        </div>
      `;
      document.getElementById("gb-close").addEventListener("click", closeModal);
      document.getElementById("gb-save").addEventListener("click", async () => {
        const val = document.getElementById("gb-token").value.trim();
        const repoVal = document.getElementById("gb-repo").value.trim();
        if (!val && !connected) return;
        const saveBtn = document.getElementById("gb-save");
        saveBtn.textContent = "Connecting\u2026"; saveBtn.disabled = true;
        const ok = await connectSync(val || meta.syncToken, repoVal);
        showToast(ok ? "Connected \u2014 syncing now\u2026" : "Couldn't connect \u2014 check the token and try again");
        renderSidebar();
        render_();
      });
      const disconnectBtn = document.getElementById("gb-disconnect");
      if (disconnectBtn) disconnectBtn.addEventListener("click", () => {
        disconnectSync();
        renderSidebar();
        closeModal();
      });
      const restoreBtn = document.getElementById("gb-restore");
      if (restoreBtn) restoreBtn.addEventListener("click", async () => {
        restoreBtn.textContent = "Syncing\u2026";
        restoreBtn.disabled = true;
        await syncPush();
        await syncPull({ manual: true });
        closeModal();
      });
    };
    showModal(`<div class="modal-backdrop"><div class="modal"></div></div>`, triggerEl);
    render_();
  }

    showModal(`
      <div class="modal-backdrop"><div class="modal">
        <h3>Archived projects</h3>
        ${list.length ? `<div class="icon-picker" style="grid-template-columns:1fr;max-height:280px;">
          ${list.map(p => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);">
              <span style="font-size:13px;color:var(--muted);">${escapeHtml(p.name)}</span>
              <div style="display:flex;gap:6px;flex-shrink:0;">
                <button type="button" class="icon-btn" data-restore-project="${p.id}">restore</button>
                <button type="button" class="icon-btn" data-delete-forever="${p.id}" style="color:var(--danger);">delete for good</button>
              </div>
            </div>
          `).join("")}
        </div>` : `<div class="empty-state-sub">No archived projects.</div>`}
        <div class="modal-actions">
          <button id="ap-close">Close</button>
        </div>
      </div></div>
    `, triggerEl);
    document.getElementById("ap-close").addEventListener("click", closeModal);
    document.querySelectorAll("[data-restore-project]").forEach(btn => {
      btn.addEventListener("click", () => { unarchiveProject(btn.dataset.restoreProject); closeModal(); });
    });
    document.querySelectorAll("[data-delete-forever]").forEach(btn => {
      btn.addEventListener("click", () => { deleteProject(btn.dataset.deleteForever); closeModal(); });
    });
  }

  function openArchiveModal(p, triggerEl) {
    showModal(`
      <div class="modal-backdrop"><div class="modal">
        <h3>Archive "${escapeHtml(p.name)}"?</h3>
        <div class="main-sub" style="margin-bottom:4px;">Its tasks stay saved but it drops out of the sidebar and Everything view. You can also delete it and its tasks for good.</div>
        <div class="modal-actions">
          <button id="am-cancel">Cancel</button>
          <button class="danger" id="am-delete">Delete for good</button>
          <button class="primary" id="am-archive">Archive</button>
        </div>
      </div></div>
    `, triggerEl);
    document.getElementById("am-cancel").addEventListener("click", closeModal);
    document.getElementById("am-archive").addEventListener("click", () => {
      p.archived = true; if (ui.selected === p.id) ui.selected = "home";
      scheduleSave(); closeModal(); render();
    });
    document.getElementById("am-delete").addEventListener("click", () => { deleteProject(p.id); closeModal(); });
  }

  function openMeetingModal(triggerEl) {
    const projects = activeProjects();
    showModal(`
      <div class="modal-backdrop"><div class="modal">
        <h3>New meeting</h3>
        <label>Title</label>
        <input type="text" id="mm-title" placeholder="e.g. ID 1:1, Symposium kickoff">
        <label>Date</label>
        <input type="date" id="mm-date" value="${todayStr()}">
        <label>Projects this covers <span style="font-weight:400;color:var(--faint)">(optional \u2014 pick none, one, or several)</span></label>
        <div class="tag-editor" id="mm-projects">
          ${projects.length ? projects.map(p => `<button type="button" class="tag-chip-toggle" data-mm-project="${p.id}">${escapeHtml(p.name)}</button>`).join("") : `<span class="empty-state-sub">No active projects yet</span>`}
        </div>
        <div class="modal-actions">
          <button id="mm-cancel">Cancel</button>
          <button class="primary" id="mm-save">Create</button>
        </div>
      </div></div>
    `, triggerEl);
    const titleInput = document.getElementById("mm-title");
    titleInput.focus();
    const picked = new Set();
    document.querySelectorAll("[data-mm-project]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.mmProject;
        if (picked.has(id)) { picked.delete(id); btn.classList.remove("on"); }
        else { picked.add(id); btn.classList.add("on"); }
      });
    });
    const save = () => {
      addMeeting(titleInput.value, document.getElementById("mm-date").value, Array.from(picked));
      closeModal();
    };
    document.getElementById("mm-save").addEventListener("click", save);
    titleInput.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
    document.getElementById("mm-cancel").addEventListener("click", closeModal);
  }

  function openClearAllModal(triggerEl) {
    showModal(`
      <div class="modal-backdrop"><div class="modal">
        <h3>Clear all data?</h3>
        <div class="main-sub">This removes every project and task. Consider exporting a backup first. There's no undo.</div>
        <div class="modal-actions">
          <button id="ca-cancel">Cancel</button>
          <button id="ca-export">Export first</button>
          <button class="danger" id="ca-confirm">Clear everything</button>
        </div>
      </div></div>
    `, triggerEl);
    document.getElementById("ca-cancel").addEventListener("click", closeModal);
    document.getElementById("ca-export").addEventListener("click", exportData);
    document.getElementById("ca-confirm").addEventListener("click", () => {
      state = { projects: [], tasks: [], meetings: [] };
      ui.selected = "home";
      scheduleSave(); closeModal(); render();
    });
  }

  load();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline support just won't be available */ });
  });
}
</script>
</body>
</html>
